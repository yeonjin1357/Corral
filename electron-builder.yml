# 앱 ID 는 예전 이름 그대로 둔다(업그레이드 설치·Windows 알림·자동 실행 등록이 이 값으로 기존 설치를 알아본다).
appId: io.github.yeonjin1357.pitwall
productName: Corral
copyright: Copyright © 2026 yeonjin1357
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!scripts/*'
  - '!build/*'
  - '!.superpowers/*'
  - '!.github/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs,mts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,.gitattributes,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  # 실행 파일 이름은 예전 이름(pitwall.exe) 그대로 둔다. 바꾸면 업그레이드 설치 프로그램이 실행 중인 예전 앱을 알아보지 못한다.
  executableName: pitwall
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # 관리자 권한 없이 사용자 폴더에 설치한다(서명 없는 앱이라 설치를 단순하게).
  oneClick: true
  perMachine: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  # Apple 개발자 서명이 없어 임시(ad-hoc) 서명만 한다. Apple Silicon 은 서명이 아예 없으면 실행되지 않는다.
  identity: '-'
  # 공증(notarize)을 하지 않으므로 강화된 런타임을 끈다. 임시 서명과 함께 켜면 라이브러리 검증에 막혀 실행되지 않을 수 있다.
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
releaseInfo:
  releaseNotes: |
    - Windows: 서명이 없어 처음 설치할 때 SmartScreen 경고가 나와요. "추가 정보 → 실행"을 눌러 주세요.
    - macOS: 아직 실제 Mac 에서 확인하지 않은(미검증) 빌드예요. 설치 방법은 README 를 봐 주세요.
publish:
  provider: github
  owner: yeonjin1357
  repo: Corral
  releaseType: draft
