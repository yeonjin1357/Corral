appId: io.github.yeonjin1357.pitwall
productName: pitwall
copyright: Copyright © 2026 yeonjin1357
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!scripts/*'
  - '!build/*'
  - '!.superpowers/*'
  - '!.github/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs,mts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,.gitattributes,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: pitwall
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # 관리자 권한 없이 사용자 폴더에 설치한다(서명 없는 앱이라 설치를 단순하게).
  oneClick: true
  perMachine: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  # Apple 개발자 서명이 없어 임시(ad-hoc) 서명만 한다. Apple Silicon 은 서명이 아예 없으면 실행되지 않는다.
  identity: '-'
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
releaseInfo:
  releaseNotes: |
    - Windows: 서명이 없어 처음 설치할 때 SmartScreen 경고가 나와요. "추가 정보 → 실행"을 눌러 주세요.
    - macOS: 아직 실제 Mac 에서 확인하지 않은(미검증) 빌드예요. 설치 방법은 README 를 봐 주세요.
publish:
  provider: github
  owner: yeonjin1357
  repo: pitwall
  releaseType: draft
