name: macOS smoke

# 실제 Mac(GitHub 의 macOS 러너)에서 확인한다.
# - collect: 진짜 ps·lsof·vm_stat 으로 수집(src/main/collect/darwin.real.test.ts), 진짜 Gradle 데몬의 프로젝트 찾기
#   (src/main/gradleDaemon.real.test.ts)와 전체 단위 테스트
# - install: README 의 설치 한 줄(scripts/install-mac.sh)로 최신 릴리스를 깔아, 경고 창 없이 열리고 다시 실행하면 바꿔 넣는지
# - update: 지금 버전을 깔고 앱 안의 업데이트 버튼으로 새 버전이 되는지, 확인 값이 틀리면 앱이 그대로인지
# - app: dmg 를 팀원이 받는 것처럼 설치하고, 앱을 띄워 수집·끄기·연동·디스크 정리를 해 본다(scripts/macos-smoke)
# 결과 표는 실행 요약에, 스크린샷·스냅샷은 아티팩트에 남는다.
# 직접 돌린다(Actions > macOS smoke > Run workflow, 또는 `gh workflow run macos-smoke.yml`). 릴리스 전에 한 번 돌려 본다.
on:
  workflow_dispatch:
    inputs:
      dmg_from:
        description: 'build: 이 커밋으로 새로 만든 dmg, release: 릴리스에 올라간 dmg(팀원이 받을 바로 그 파일)'
        type: choice
        options: [build, release]
        default: build
      release_tag:
        description: 'release 일 때 받을 태그(예: v0.2.0). 비우면 최신 릴리스'
        default: ''

permissions:
  contents: read

env:
  DMG_FROM: ${{ inputs.dmg_from }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  TZ: Asia/Seoul

jobs:
  collect:
    name: collect (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 러너마다 깔려 있는 22.x 가 달라 결과가 갈리지 않게 최신 22.x 로 맞춘다.
          check-latest: true
          cache: npm
      - run: npm ci
      - name: 실제 명령 출력(형식 확인용)
        run: |
          sw_vers
          uname -m
          echo "--- ps (stats)"
          LC_ALL=en_US.UTF-8 /bin/ps -axww -o pid=,ppid=,rss=,time=,lstart=,comm= | head -12
          echo "--- ps (args)"
          /bin/ps -axww -o pid=,args= | head -6
          echo "--- lsof"
          /usr/sbin/lsof -nP -iTCP -FpnT -w | head -20
          echo "--- vm_stat"
          /usr/bin/vm_stat
      - name: 진짜 명령으로 수집 확인
        run: npx vitest run src/main/collect/darwin.real.test.ts --reporter=verbose
      # 진짜 Gradle 데몬을 임시 Gradle 폴더로 띄워, 쉬는 데몬의 프로젝트를 로그에서 찾는지 본다.
      - name: 진짜 Gradle 데몬으로 프로젝트 찾기 확인
        env:
          CORRAL_REAL_GRADLE: '1'
        run: |
          command -v gradle
          npx vitest run src/main/gradleDaemon.real.test.ts --reporter=verbose
      - name: 전체 단위 테스트
        run: npm test

  # README 의 설치 한 줄(scripts/install-mac.sh)로 최신 릴리스를 깔고, 경고 창 없이 열리는지와 다시 실행해 바꿔 넣는지 본다.
  install:
    name: install script (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 설치 스크립트 확인
        run: |
          export SMOKE_OUT="$RUNNER_TEMP/install-out"
          bash scripts/macos-smoke/check-install.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-install-${{ matrix.os }}
          path: ${{ runner.temp }}/install-out
          if-no-files-found: warn

  # 앱 안 업데이트: 지금 버전을 깔고 업데이트 버튼으로 새 버전(이 커밋으로 만든 99.0.0)이 되는지,
  # 확인 값이 틀리면 앱이 그대로 남는지 본다(scripts/macos-smoke/check-update.sh).
  update:
    name: in-app update (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 앱 안 업데이트 확인
        run: |
          export SMOKE_OUT="$RUNNER_TEMP/update-out"
          bash scripts/macos-smoke/check-update.sh
      - name: 요약
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/update-out/update-summary.md" ]; then
            cat "$RUNNER_TEMP/update-out/update-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-update-${{ matrix.os }}
          path: ${{ runner.temp }}/update-out
          if-no-files-found: warn

  app:
    name: app (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 경로 정하기
        run: |
          echo "SMOKE_OUT=$RUNNER_TEMP/smoke-out" >> "$GITHUB_ENV"
          echo "SMOKE_DMG_DIR=$RUNNER_TEMP/dmg" >> "$GITHUB_ENV"
          echo "SMOKE_ROOT=$RUNNER_TEMP/작업 공간" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/smoke-out" "$RUNNER_TEMP/dmg"
      - name: 릴리스에서 dmg 받기
        if: env.DMG_FROM == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH=$(uname -m); [ "$ARCH" = x86_64 ] && ARCH=x64
          # 태그를 비우면 최신 릴리스를 받는다.
          gh release download ${RELEASE_TAG:+"$RELEASE_TAG"} --repo "$GITHUB_REPOSITORY" \
            --pattern "corral-*-$ARCH.dmg" --dir "$SMOKE_DMG_DIR"
          ls -la "$SMOKE_DMG_DIR"
      - name: 이 커밋으로 dmg 만들기
        if: env.DMG_FROM == 'build'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          ARCH=$(uname -m); [ "$ARCH" = x86_64 ] && ARCH=x64
          npm ci
          npx electron-vite build
          npx electron-builder --mac dmg "--$ARCH" --publish never
          cp dist/corral-*-"$ARCH".dmg "$SMOKE_DMG_DIR/"
      - name: 설치(격리 속성 → Gatekeeper → README 의 xattr)
        run: bash scripts/macos-smoke/install.sh
      - name: 보여 줄 것 만들기(저장소·서버·에이전트)
        run: bash scripts/macos-smoke/fixtures.sh
      - name: 앱 띄워 확인
        run: node scripts/macos-smoke/drive.mjs
      - name: 요약
        if: always()
        run: |
          if [ -f "$SMOKE_OUT/summary.md" ]; then cat "$SMOKE_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          ls -la "$SMOKE_OUT" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke-out
          if-no-files-found: warn
