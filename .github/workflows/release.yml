name: Release

# v 로 시작하는 태그(예: v0.2.0)를 올리면 Windows·macOS 설치 파일을 만들어 초안(draft) 릴리스에 올린다.
# 태그 버전은 package.json 의 version 과 같아야 한다. 초안을 확인한 뒤 GitHub 에서 직접 게시한다.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 서명 인증서가 없다(macOS 는 임시 서명, Windows 는 서명 없음).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
